general {
    grace = 5
    disable_loading_bar = false
    hide_cursor = false
}

# Match SDDM glyph: LockScreen.jpg background with subtle dark overlay
background {
    monitor =
    path = ~/dotfiles/wallpapers/LockScreen.jpg
    blur_passes = 0
    noise = 0.0
    contrast = 1.0
    brightness = 0.85
    vibrancy = 0.0
}

# Password input — colors sampled from LockScreen.jpg (avg RGB 45,45,44)
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2

    outer_color = rgba(45,45,44,1.0)
    inner_color = rgba(45,45,44,0.85)
    font_color = rgba(255,255,255,1.0)
    check_color = rgba(45,45,44,0.9)
    fail_color = rgba(45,45,44,1.0)

    rounding = 6

    position = 0, -80
    halign = center
    valign = center

    font_family = Ndot 57 Aligned
    fade_on_empty = false
    placeholder_text = <span foreground="##FFFFFFB0">Password</span>
}
